<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Profil - Administrasi Digital Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-4xl space-y-4">
    
    <!-- BAR TOP HEADER -->
    <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center gap-2 text-indigo-900 font-black text-lg">
        <i data-lucide="settings" class="w-6 h-6"></i>
        <span>PENGATURAN PROFIL</span>
      </div>
      <a href="index.html" class="bg-slate-900 hover:bg-black text-white px-5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
      </a>
    </div>

    <!-- FORM PENGATURAN PROFIL -->
    <div class="glass-card rounded-3xl p-6 md:p-8">
      <div class="flex items-center gap-2 mb-6 text-indigo-900">
        <i data-lucide="user-cog" class="w-5 h-5"></i>
        <h2 class="font-bold text-base">Ubah Profil Pengguna & Sekolah</h2>
      </div>

      <form id="formProfil" onsubmit="simpanProfil(event)" class="space-y-5 text-xs font-semibold text-slate-700">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          
          <div>
            <label class="block mb-1.5 font-bold">Nama Lengkap Guru (dengan Gelar)</label>
            <input type="text" id="profNamaGuru" class="w-full px-4 py-2.5 rounded-xl bg-white/80 border border-slate-200 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500" required>
          </div>

          <div>
            <label class="block mb-1.5 font-bold">NIP / NUPTK</label>
            <input type="text" id="profNip" class="w-full px-4 py-2.5 rounded-xl bg-white/80 border border-slate-200 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block mb-1.5 font-bold">Nama Sekolah</label>
            <input type="text" id="profSekolah" class="w-full px-4 py-2.5 rounded-xl bg-white/80 border border-slate-200 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500" required>
          </div>

          <div>
            <label class="block mb-1.5 font-bold">Tahun Ajaran</label>
            <input type="text" id="profTA" class="w-full px-4 py-2.5 rounded-xl bg-white/80 border border-slate-200 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block mb-1.5 font-bold">Motto Guru / Sekolah</label>
            <input type="text" id="profMotto" placeholder="Contoh: BERGERAK" class="w-full px-4 py-2.5 rounded-xl bg-white/80 border border-slate-200 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block mb-1.5 font-bold">URL / Link Foto Profil</label>
            <input type="text" id="profFoto" placeholder="https://..." class="w-full px-4 py-2.5 rounded-xl bg-white/80 border border-slate-200 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

        </div>

        <div class="flex justify-end pt-4">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 shadow-lg transition text-xs">
            <i data-lucide="save" class="w-4 h-4"></i> SIMPAN PROFIL SAYA
          </button>
        </div>
      </form>
    </div>

  </div>

  <script>
    function muatProfil() {
      // Ambil data profil tersimpan
      const data = JSON.parse(localStorage.getItem('headerGuruData')) || {
        foto: "https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=200",
        sekolah: "SD NEGERI 1 GUWA LOR",
        namaGuru: "CHAIRUL ANWAR, S.Pd.",
        nip: "198007082022211005",
        motto: "BERGERAK",
        ta: "2026/2027",
        sem: "Sem. Ganjil"
      };

      document.getElementById('profNamaGuru').value = data.namaGuru || '';
      document.getElementById('profNip').value = data.nip || '';
      document.getElementById('profSekolah').value = data.sekolah || '';
      document.getElementById('profTA').value = data.ta || '';
      
      // Bersihkan tanda petik agar mudah diedit
      let mottoClean = (data.motto || '').replace(/^"|"$/g, '');
      document.getElementById('profMotto').value = mottoClean;
      document.getElementById('profFoto').value = data.foto || '';
    }

    function simpanProfil(e) {
      e.preventDefault();

      const dataLama = JSON.parse(localStorage.getItem('headerGuruData')) || {};
      let mottoInput = document.getElementById('profMotto').value.trim();

      const dataBaru = {
        foto: document.getElementById('profFoto').value || dataLama.foto || "https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=200",
        sekolah: document.getElementById('profSekolah').value,
        namaGuru: document.getElementById('profNamaGuru').value,
        nip: document.getElementById('profNip').value,
        motto: mottoInput,
        ta: document.getElementById('profTA').value,
        sem: dataLama.sem || "Sem. Ganjil"
      };

      // Simpan data secara menyeluruh
      localStorage.setItem('headerGuruData', JSON.stringify(dataBaru));
      localStorage.setItem('fotoGuruURL', dataBaru.foto);

      alert('✅ Profil berhasil diperbarui!');
      window.location.href = 'index.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      muatProfil();
    });
  </script>
</body>
</html>
