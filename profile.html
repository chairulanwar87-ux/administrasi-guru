<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil & Kelas - SD NEGERI 1 GUWA LOR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
        
        <!-- Header -->
        <div class="bg-indigo-600 px-6 py-4 text-white flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="bi bi-person-gear text-2xl"></i>
                <h1 class="text-xl font-bold">Edit Profil & Kelas</h1>
            </div>
            <a href="rapor.html" class="bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                <i class="bi bi-arrow-left"></i> Kembali ke Rapor
            </a>
        </div>

        <!-- Form Edit -->
        <form id="profileForm" class="p-6 space-y-4">
            
            <!-- Nama Siswa -->
            <div>
                <label for="namaSiswa" class="block text-sm font-medium text-slate-700 mb-1">Nama Siswa</label>
                <input type="text" id="namaSiswa" name="namaSiswa" value="ABID FADHIL ABYAN" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
            </div>

            <!-- Jenis Kelamin -->
            <div>
                <label for="jenisKelamin" class="block text-sm font-medium text-slate-700 mb-1">Jenis Kelamin</label>
                <select id="jenisKelamin" name="jenisKelamin" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                    <option value="Laki-Laki" selected>Laki-Laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>

            <!-- Grid 2 Kolom untuk Kelas & Semester -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Kelas -->
                <div>
                    <label for="kelas" class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
                    <input type="text" id="kelas" name="kelas" value="IV (Empat)" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                </div>

                <!-- Semester -->
                <div>
                    <label for="semester" class="block text-sm font-medium text-slate-700 mb-1">Semester</label>
                    <select id="semester" name="semester" 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                        <option value="1 (Ganjil)" selected>1 (Ganjil)</option>
                        <option value="2 (Genap)">2 (Genap)</option>
                    </select>
                </div>
            </div>

            <!-- Tahun Ajaran -->
            <div>
                <label for="tahunAjaran" class="block text-sm font-medium text-slate-700 mb-1">Tahun Ajaran</label>
                <input type="text" id="tahunAjaran" name="tahunAjaran" value="2026/2027" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
            </div>

            <hr class="my-4 border-slate-200">

            <!-- Alert Notifikasi Sukses -->
            <div id="alertSuccess" class="hidden p-3 bg-emerald-100 text-emerald-800 rounded-lg text-sm border border-emerald-300">
                <i class="bi bi-check-circle-fill mr-1"></i> Data profil berhasil diperbarui!
            </div>

            <!-- Tombol Aksi -->
            <div class="flex justify-end gap-3 pt-2">
                <a href="rapor.html" class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition">
                    Batal
                </a>
                <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow transition flex items-center gap-2">
                    <i class="bi bi-floppy"></i> Simpan Perubahan
                </button>
            </div>

        </form>
    </div>

    <!-- Script Pengolahan Data -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('profileForm');
            const alertSuccess = document.getElementById('alertSuccess');

            // 1. Muat data lama dari localStorage (jika ada)
            const savedData = JSON.parse(localStorage.getItem('studentProfile'));
            if (savedData) {
                document.getElementById('namaSiswa').value = savedData.namaSiswa || 'ABID FADHIL ABYAN';
                document.getElementById('jenisKelamin').value = savedData.jenisKelamin || 'Laki-Laki';
                document.getElementById('kelas').value = savedData.kelas || 'IV (Empat)';
                document.getElementById('semester').value = savedData.semester || '1 (Ganjil)';
                document.getElementById('tahunAjaran').value = savedData.tahunAjaran || '2026/2027';
            }

            // 2. Simpan data saat Form di-Submit
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const updatedProfile = {
                    namaSiswa: document.getElementById('namaSiswa').value,
                    jenisKelamin: document.getElementById('jenisKelamin').value,
                    kelas: document.getElementById('kelas').value,
                    semester: document.getElementById('semester').value,
                    tahunAjaran: document.getElementById('tahunAjaran').value,
                };

                // Simpan ke localStorage
                localStorage.setItem('studentProfile', JSON.stringify(updatedProfile));

                // Tampilkan notifikasi
                alertSuccess.classList.remove('hidden');

                // Hilangkan notifikasi setelah 2.5 detik lalu kembali ke rapor.html
                setTimeout(() => {
                    alertSuccess.classList.add('hidden');
                    window.location.href = 'rapor.html';
                }, 1500);
            });
        });
    </script>
</body>
</html>
