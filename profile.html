<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Guru - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- HEADER / NAVBAR -->
        <header class="p-4 md:px-8">
            <div class="max-w-4xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="user" class="w-5 h-5 text-indigo-600"></i> PROFIL GURU & KELAS
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-4xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            
            <div class="glass-card rounded-2xl p-6 md:p-8 shadow-xl">
                <!-- HEADER CARD -->
                <div class="flex items-center gap-4 mb-6 border-b border-slate-300/60 pb-4">
                    <div class="w-16 h-16 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-2xl shadow-md">
                        <i data-lucide="user-check" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-extrabold text-slate-800">Biodata Pengampu</h2>
                        <p class="text-xs text-slate-600">Informasi ini akan ditampilkan pada lembar laporan dan cetak rapor.</p>
                    </div>
                </div>

                <!-- FORM PROFIL -->
                <form id="formProfil" onsubmit="simpanProfil(event)" class="space-y-4">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap Guru & Gelar</label>
                            <input type="text" id="namaGuru" placeholder="Contoh: Budi Santoso, S.Pd." required class="w-full px-3 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">NIP / NUPTK</label>
                            <input type="text" id="nipGuru" placeholder="Contoh: 19850101 201001 1 001" required class="w-full px-3 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Jabatan / Kelas Pengampu</label>
                            <input type="text" id="kelasGuru" placeholder="Contoh: Wali Kelas IV-A" required class="w-full px-3 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nama Instansi / Sekolah</label>
                            <input type="text" id="sekolahGuru" placeholder="Contoh: SDN 1 Merdeka" required class="w-full px-3 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                        </div>
                    </div>

                    <div class="pt-2 flex justify-end">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> SIMPAN PROFIL
                        </button>
                    </div>
                </form>
            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <!-- SCRIPT LOGIKA LOCALSTORAGE -->
    <script>
        lucide.createIcons();

        // 1. Muat profil tersimpan saat halaman dibuka
        function muatProfil() {
            const profil = JSON.parse(localStorage.getItem('profilGuru')) || {
                nama: "Budi Santoso, S.Pd.",
                nip: "19850101 201001 1 001",
                kelas: "Wali Kelas IV-A",
                sekolah: "SDN 1 Merdeka"
            };

            document.getElementById('namaGuru').value = profil.nama;
            document.getElementById('nipGuru').value = profil.nip;
            document.getElementById('kelasGuru').value = profil.kelas;
            document.getElementById('sekolahGuru').value = profil.sekolah;
        }

        // 2. Simpan profil ke LocalStorage
        function simpanProfil(event) {
            event.preventDefault();
            const profilBaru = {
                nama: document.getElementById('namaGuru').value,
                nip: document.getElementById('nipGuru').value,
                kelas: document.getElementById('kelasGuru').value,
                sekolah: document.getElementById('sekolahGuru').value
            };

            localStorage.setItem('profilGuru', JSON.stringify(profilBaru));
            alert("Profil guru berhasil diperbarui!");
        }

        // Jalankan saat dimuat
        muatProfil();
    </script>
</body>
</html>
