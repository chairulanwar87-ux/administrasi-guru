<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil & Kelas - SD NEGERI 1 GUWA LOR</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">
        
        <!-- HEADER / NAVBAR -->
        <header class="p-4 md:px-8">
            <div class="max-w-4xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="user-cog" class="w-5 h-5 text-indigo-600"></i> EDIT PROFIL & KELAS
                </h1>
                <a href="rapor.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-4xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            
            <div class="glass-card rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
                
                <div class="border-b-2 border-slate-800 pb-3">
                    <h2 class="text-xl font-black uppercase tracking-wide text-slate-900">PENGATURAN PROFIL SEKOLAH & KELAS</h2>
                    <p class="text-xs font-semibold text-slate-600">Perbarui informasi sekolah, kelas, dan wali kelas yang akan tercetak pada laporan rapor.</p>
                </div>

                <!-- FORM EDIT DATA -->
                <form id="formProfil" class="space-y-4">
                    
                    <!-- Nama Sekolah -->
                    <div>
                        <label class="block font-bold text-slate-700 text-xs mb-1">Nama Sekolah / Kop Rapor:</label>
                        <input type="text" id="namaSekolah" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-xs bg-white/80">
                    </div>

                    <!-- Grid Kelas & Semester -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-bold text-slate-700 text-xs mb-1">Kelas:</label>
                            <input type="text" id="kelas" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-xs bg-white/80">
                        </div>

                        <div>
                            <label class="block font-bold text-slate-700 text-xs mb-1">Semester:</label>
                            <select id="semester" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-xs bg-white/80">
                                <option value="1 (Ganjil)">1 (Ganjil)</option>
                                <option value="2 (Genap)">2 (Genap)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Grid Tahun Ajaran & Wali Kelas -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-bold text-slate-700 text-xs mb-1">Tahun Ajaran:</label>
                            <input type="text" id="tahunAjaran" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-xs bg-white/80">
                        </div>

                        <div>
                            <label class="block font-bold text-slate-700 text-xs mb-1">Nama Guru / Wali Kelas:</label>
                            <input type="text" id="namaGuru" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-xs bg-white/80">
                        </div>
                    </div>

                    <!-- Alert Notifikasi Berhasil -->
                    <div id="alertSuccess" class="hidden p-3 bg-emerald-100 text-emerald-800 rounded-xl text-xs font-bold border border-emerald-300 flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i>
                        <span>Data profil berhasil diperbarui! Mengalihkan kembali...</span>
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-300">
                        <a href="rapor.html" class="px-4 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs transition">
                            Batal
                        </a>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-1.5">
                            <i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan
                        </button>
                    </div>

                </form>

            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru
        </footer>

    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            // Read data from localStorage (Default ke Chairul Anwar, S.Pd. & IV (Empat))
            const profil = JSON.parse(localStorage.getItem('profilSekolahGuru')) || {
                namaSekolah: "SD NEGERI 1 GUWA LOR",
                kelas: "IV (Empat)",
                tahunAjaran: "2026/2027",
                semester: "1 (Ganjil)",
                namaGuru: "Chairul Anwar, S.Pd.",
                nipGuru: "-"
            };

            // Fill inputs with current data
            document.getElementById('namaSekolah').value = profil.namaSekolah || 'SD NEGERI 1 GUWA LOR';
            document.getElementById('kelas').value = profil.kelas || 'IV (Empat)';
            document.getElementById('semester').value = profil.semester || '1 (Ganjil)';
            document.getElementById('tahunAjaran').value = profil.tahunAjaran || '2026/2027';
            document.getElementById('namaGuru').value = profil.namaGuru || 'Chairul Anwar, S.Pd.';

            // Handle Save Form
            document.getElementById('formProfil').addEventListener('submit', (e) => {
                e.preventDefault();

                const updatedProfil = {
                    namaSekolah: document.getElementById('namaSekolah').value,
                    kelas: document.getElementById('kelas').value,
                    semester: document.getElementById('semester').value,
                    tahunAjaran: document.getElementById('tahunAjaran').value,
                    namaGuru: document.getElementById('namaGuru').value,
                    nipGuru: profil.nipGuru || '-'
                };

                // Save back to localStorage
                localStorage.setItem('profilSekolahGuru', JSON.stringify(updatedProfil));

                // Show alert & auto redirect
                const alert = document.getElementById('alertSuccess');
                alert.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'rapor.html';
                }, 1000);
            });
        });
    </script>
</body>
</html>
