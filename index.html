<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Administrasi Guru</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <style>
    /* Styling tambahan untuk menyesuaikan tema */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">Aplikasi Administrasi Guru</h1>
    <div class="flex items-center gap-3">
      <img id="fotoProfil" src="https://via.placeholder.com/40" alt="Foto Profil" class="w-10 h-10 rounded-full border-2 border-white object-cover">
    </div>
  </header>

  <!-- DASHBOARD STATS -->
  <main class="container mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
        <h3 class="text-gray-500 text-sm font-medium">Total Siswa</h3>
        <p class="text-3xl font-bold text-blue-600 mt-1">32</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
        <h3 class="text-gray-500 text-sm font-medium">Mata Pelajaran</h3>
        <p class="text-3xl font-bold text-green-600 mt-1">8</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
        <h3 class="text-gray-500 text-sm font-medium">Modul Ajar</h3>
        <p class="text-3xl font-bold text-purple-600 mt-1">12</p>
      </div>
    </div>

    <!-- MENU UTAMA -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <a href="siswa.html" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center hover:shadow-md transition flex flex-col items-center">
        <span class="text-4xl mb-2">🎓</span>
        <span class="font-semibold text-gray-700">Data Siswa</span>
      </a>
      <a href="absensi.html" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center hover:shadow-md transition flex flex-col items-center">
        <span class="text-4xl mb-2">📋</span>
        <span class="font-semibold text-gray-700">Absensi</span>
      </a>
      <a href="nilai.html" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center hover:shadow-md transition flex flex-col items-center">
        <span class="text-4xl mb-2">📊</span>
        <span class="font-semibold text-gray-700">Nilai</span>
      </a>
      <a href="profile.html" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center hover:shadow-md transition flex flex-col items-center">
        <span class="text-4xl mb-2">👤</span>
        <span class="font-semibold text-gray-700">Profil Guru</span>
      </a>
    </div>
  </main>

  <!-- KODE BACKSOUND MUSIK MP3 -->
  <audio id="bgMusic" loop preload="auto">
    <source src="Bayalangu.mp3" type="audio/mpeg">
  </audio>

  <!-- TOMBOL PEMUTAR MUSIK -->
  <button id="musicBtn" onclick="toggleMusic()" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px;">
    🎵 Putar Musik
  </button>

  <script>
    var audio = document.getElementById("bgMusic");
    var btn = document.getElementById("musicBtn");

    function toggleMusic() {
      if (audio.paused) {
        audio.play().then(() => {
          btn.innerHTML = "⏸️ Hentikan Musik";
          btn.style.background = "#dc2626";
        }).catch(err => {
          alert("Gagal memutar lagu. Pastikan nama file di GitHub adalah Bayalangu.mp3");
        });
      } else {
        audio.pause();
        btn.innerHTML = "🎵 Putar Musik";
        btn.style.background = "#2563eb";
      }
    }

    // Putar lagu begitu ada klik pertama di mana saja pada layar
    document.addEventListener('click', function() {
      if (audio.paused) {
        audio.play().then(() => {
          btn.innerHTML = "⏸️ Hentikan Musik";
          btn.style.background = "#dc2626";
        }).catch(() => {});
      }
    }, { once: true });
  </script>

</body>
</html>
