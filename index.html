<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrasi Guru Digital</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- HEADER / NAVBAR -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">Aplikasi Administrasi Guru</h1>
    <div class="flex items-center gap-3">
      <img id="fotoProfil" src="https://via.placeholder.com/40" alt="Foto Profil" class="w-10 h-10 rounded-full border-2 border-white object-cover">
      <input type="checkbox" id="darkModeToggle" class="hidden">
    </div>
  </header>

  <!-- KONTEN UTAMA / DASHBOARD -->
  <main class="container mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-lg shadow">
        <h3 class="text-gray-500 text-sm">Total Siswa</h3>
        <p class="text-2xl font-bold text-blue-600">32</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <h3 class="text-gray-500 text-sm">Mata Pelajaran</h3>
        <p class="text-2xl font-bold text-green-600">8</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <h3 class="text-gray-500 text-sm">Modul Ajar</h3>
        <p class="text-2xl font-bold text-purple-600">12</p>
      </div>
    </div>

    <!-- MENU NAVIGASI -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <a href="siswa.html" class="bg-white p-4 rounded-lg shadow text-center hover:bg-blue-50 transition">
        <span class="text-3xl">👨‍🎓</span>
        <p class="font-semibold mt-2">Data Siswa</p>
      </a>
      <a href="absensi.html" class="bg-white p-4 rounded-lg shadow text-center hover:bg-blue-50 transition">
        <span class="text-3xl">📋</span>
        <p class="font-semibold mt-2">Absensi</p>
      </a>
      <a href="nilai.html" class="bg-white p-4 rounded-lg shadow text-center hover:bg-blue-50 transition">
        <span class="text-3xl">📊</span>
        <p class="font-semibold mt-2">Nilai</p>
      </a>
      <a href="profile.html" class="bg-white p-4 rounded-lg shadow text-center hover:bg-blue-50 transition">
        <span class="text-3xl">👤</span>
        <p class="font-semibold mt-2">Profil Guru</p>
      </a>
    </div>
  </main>

  <!-- SCRIPT APLIKASI DASAR -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Inisialisasi Fitur
      if (typeof startClock === 'function') startClock();
      if (typeof seedDatabase === 'function') await seedDatabase();
      if (typeof loadDashboardStats === 'function') loadDashboardStats();

      // 2. Load Tema & Profil
      const savedTheme = localStorage.getItem('prefThemeColor');
      if (savedTheme && typeof setThemeColor === 'function') setThemeColor(savedTheme);

      const savedDark = localStorage.getItem('prefDarkMode') === 'true';
      if (savedDark) {
        const toggle = document.getElementById('darkModeToggle');
        if (toggle) toggle.checked = true;
        if (typeof toggleDarkMode === 'function') toggleDarkMode(true);
      }

      if (localStorage.getItem('fotoGuruURL')) {
        const img = document.getElementById('fotoProfil');
        if (img) img.src = localStorage.getItem('fotoGuruURL');
      }
    });
  </script>

  <!-- ==================================================== -->
  <!-- KODE BACKSOUND MUSIK MP3 & TOMBOL PEMUTAR (BARIS BARU) -->
  <!-- ==================================================== -->
  <audio id="bgMusic" loop preload="auto">
    <source src="Bayalangu.mp3" type="audio/mpeg">
  </audio>

  <!-- TOMBOL MUSIK MELAYANG POJOK KANAN BAWAH -->
  <button id="musicBtn" onclick="toggleMusic()" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px;">
    🎵 Putar Musik
  </button>

  <script>
    var audio = document.getElementById("bgMusic");
    var btn = document.getElementById("musicBtn");

    function toggleMusic() {
      if (audio.paused) {
        audio.play().then(() => {
          btn.innerHTML = "⏸️ Hentikan Musik";
          btn.style.background = "#dc2626"; // Berubah merah saat berputar
        }).catch(err => {
          alert("Gagal memutar musik. Pastikan file Bayalangu.mp3 ada di folder GitHub.");
        });
      } else {
        audio.pause();
        btn.innerHTML = "🎵 Putar Musik";
        btn.style.background = "#2563eb"; // Berubah biru saat berhenti
      }
    }

    // Putar otomatis saat klik pertama di area layar mana saja
    document.addEventListener('click', function() {
      if (audio.paused) {
        audio.play().then(() => {
          btn.innerHTML = "⏸️ Hentikan Musik";
          btn.style.background = "#dc2626";
        }).catch(() => {});
      }
    }, { once: true });
  </script>

</body>
</html>
