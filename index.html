<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi Digital Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">
        
        <!-- HEADER UTAMA ASLI / SEMULA -->
        <header class="p-3 md:p-4">
            <div class="max-w-7xl mx-auto glass-card rounded-2xl p-3 md:p-4 shadow-xl flex items-center justify-between gap-4">
                
                <!-- KIRI: Foto & Identitas -->
                <div class="flex items-center gap-3">
                    <img id="headerFoto" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250" alt="Foto Guru" class="w-12 h-12 md:w-14 md:h-14 rounded-full border-2 border-white object-cover shadow-md">
                    <div>
                        <h1 class="text-base md:text-xl font-black text-blue-600 tracking-wide uppercase leading-tight">
                            ADMINISTRASI DIGITAL GURU
                        </h1>
                        <p class="text-xs md:text-sm font-bold text-slate-700 tracking-tight">
                            <span id="dispSekolah">SD NEGERI 1 GUWA LOR</span> • 
                            <span id="dispGuru">CHAIRUL ANWAR, S.Pd</span> • 
                            "<span id="dispMotto" class="italic">BERGELORA</span>"
                        </p>
                        <div class="flex items-center gap-2 mt-0.5 text-[11px] font-semibold text-slate-600">
                            <span class="flex items-center gap-1 text-blue-600 font-bold">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i> <span id="jamDigital">16.00.00</span>
                            </span>
                            <span>•</span>
                            <span id="tanggalDigital">Minggu, 26 Juli 2026</span>
                            <span id="headerTA" class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md font-bold ml-1">Sem. Ganjil • 2026/2027</span>
                        </div>
                    </div>
                </div>

                <!-- KANAN: Tombol Pengaturan (Icon Gear Semula) -->
                <div class="flex items-center gap-2">
                    <a href="pengaturan.html" class="p-2 bg-white hover:bg-slate-100 rounded-xl border border-slate-300 text-slate-700 shadow-sm transition" title="Pengaturan">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                    </a>
                </div>

            </div>
        </header>

        <!-- DASHBOARD MENU UTAMA SEMULA -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-2 md:grid-cols-4 gap-4">
            
            <a href="siswa.html" class="glass-card p-6 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center group">
                <div class="p-4 bg-blue-500 text-white rounded-2xl mb-3 group-hover:bg-blue-600 transition shadow-md">
                    <i data-lucide="users" class="w-7 h-7"></i>
                </div>
                <span class="font-bold text-sm text-slate-800">Data Siswa</span>
            </a>

            <a href="nilai.html" class="glass-card p-6 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center group">
                <div class="p-4 bg-emerald-500 text-white rounded-2xl mb-3 group-hover:bg-emerald-600 transition shadow-md">
                    <i data-lucide="graduation-cap" class="w-7 h-7"></i>
                </div>
                <span class="font-bold text-sm text-slate-800">Input Nilai</span>
            </a>

            <a href="rekap.html" class="glass-card p-6 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center group">
                <div class="p-4 bg-amber-500 text-white rounded-2xl mb-3 group-hover:bg-amber-600 transition shadow-md">
                    <i data-lucide="calendar-check" class="w-7 h-7"></i>
                </div>
                <span class="font-bold text-sm text-slate-800">Absensi Siswa</span>
            </a>

            <a href="rapor.html" class="glass-card p-6 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center group">
                <div class="p-4 bg-rose-500 text-white rounded-2xl mb-3 group-hover:bg-rose-600 transition shadow-md">
                    <i data-lucide="file-spreadsheet" class="w-7 h-7"></i>
                </div>
                <span class="font-bold text-sm text-slate-800">Cetak Rapor</span>
            </a>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru Digital
        </footer>
    </div>

    <!-- JAVASCRIPT ASLI -->
    <script>
        lucide.createIcons();

        // Memuat profil dari localStorage (jika ada yang diedit dari pengaturan.html)
        function muatData() {
            const profil = JSON.parse(localStorage.getItem('profilSekolahGuru')) || {
                namaSekolah: "SD NEGERI 1 GUWA LOR",
                namaGuru: "CHAIRUL ANWAR, S.Pd",
                motto: "BERGELORA",
                tahunAjaran: "2026/2027",
                foto: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250"
            };

            document.getElementById('dispSekolah').innerText = profil.namaSekolah || "SD NEGERI 1 GUWA LOR";
            document.getElementById('dispGuru').innerText = profil.namaGuru || "CHAIRUL ANWAR, S.Pd";
            document.getElementById('dispMotto').innerText = profil.motto || "BERGELORA";
            if (document.getElementById('headerTA')) {
                document.getElementById('headerTA').innerText = `Sem. Ganjil • ${profil.tahunAjaran || '2026/2027'}`;
            }
            if (profil.foto && document.getElementById('headerFoto')) {
                document.getElementById('headerFoto').src = profil.foto;
            }
        }

        // Jam Digital
        function updateJam() {
            const now = new Date();
            document.getElementById('jamDigital').innerText = `${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}.${String(now.getSeconds()).padStart(2,'0')}`;
            document.getElementById('tanggalDigital').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            muatData();
            updateJam();
            setInterval(updateJam, 1000);
        });
    </script>
</body>
</html>
