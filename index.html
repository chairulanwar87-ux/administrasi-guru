<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrasi Digital Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }
  </style>
</head>
<body class="p-4 bg-slate-100">

  <!-- HEADER BAR (SAMA PERSIS DENGAN KODE ASLI ANDA) -->
  <header class="glass-card rounded-3xl p-4 mb-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <div class="relative group cursor-pointer" title="Klik untuk ganti foto profil" onclick="document.getElementById('uploadFoto').click()">
        <img id="fotoProfil" src="https://via.placeholder.com/100" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md">
        <input type="file" id="uploadFoto" accept="image/*" class="hidden" onchange="gantiFoto(event)">
      </div>

      <div>
        <h1 class="text-2xl font-black theme-active-text tracking-tight leading-none uppercase">ADMINISTRASI DIGITAL GURU</h1>
        <div class="flex items-center gap-2 text-xs font-bold text-slate-700 mt-1">
          <span id="txtSekolah"></span> •
          <span id="txtGuru"></span> •
          <span id="txtMotto" class="italic text-slate-500"></span>
        </div>
        <div class="flex items-center gap-2 text-[11px] font-semibold text-slate-600 mt-1">
          <span id="realtimeClock" class="theme-active-text font-mono font-bold">🕒 00:00:00</span>
          <span id="realtimeDate">...</span>
          <span id="txtSemesterTA" class="bg-blue-500/20 text-blue-700 px-2 py-0.5 rounded-md text-[10px] font-bold">Sem. Ganjil • 2026/2027</span>
        </div>
      </div>
    </div>

    <!-- TOMBOL EDIT HEADER -->
    <div>
      <button onclick="bukaModalHeader()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition">
        Edit Profile / Header
      </button>
    </div>
  </header>

  <!-- MODAL EDIT DATA (NAMA, SEKOLAH, MOTTO & FOTO) -->
  <div id="modalHeader" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 w-full max-w-md space-y-3 shadow-xl">
      <h3 class="font-bold text-slate-800 text-sm border-b pb-2">Edit Data Header Guru</h3>
      
      <div class="space-y-2 text-xs font-semibold text-slate-700">
        <div>
          <label class="block mb-1">Upload Foto Profil Guru</label>
          <input type="file" id="inputFotoModal" accept="image/*" class="w-full text-xs text-slate-500 border rounded-lg p-1">
        </div>
        <div>
          <label class="block mb-1">Nama Sekolah</label>
          <input type="text" id="inputNamaSekolah" placeholder="Contoh: SD NEGERI 1 GUWA LOR" class="w-full px-3 py-1.5 border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block mb-1">Nama Guru</label>
          <input type="text" id="inputNamaGuru" placeholder="Contoh: CHAIRUL ANWAR, S.Pd." class="w-full px-3 py-1.5 border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block mb-1">Motto</label>
          <input type="text" id="inputMotto" placeholder="Contoh: BERGELORA" class="w-full px-3 py-1.5 border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t">
        <button onclick="tutupModalHeader()" class="px-3 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-100 rounded-lg">Batal</button>
        <button onclick="simpanHeaderModal()" class="px-3 py-1.5 text-xs font-bold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    // FUNGSI UPLOAD FOTO DARI KLIK GAMBAR
    function gantiFoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const imgBase64 = evt.target.result;
          document.getElementById('fotoProfil').src = imgBase64;
          localStorage.setItem('fotoGuruURL', imgBase64);
        };
        reader.readAsDataURL(file);
      }
    }

    // MUAT DATA HEADER
    function muatHeader() {
      const dataHeader = JSON.parse(localStorage.getItem('headerGuruData')) || {};
      const fotoDisimpan = localStorage.getItem('fotoGuruURL');

      // Foto profil
      if (fotoDisimpan) {
        document.getElementById('fotoProfil').src = fotoDisimpan;
      } else {
        document.getElementById('fotoProfil').src = "https://via.placeholder.com/100";
      }

      // Teks Nama Sekolah, Nama Guru, Motto
      document.getElementById('txtSekolah').innerText = dataHeader.sekolah || "[Nama Sekolah]";
      document.getElementById('txtGuru').innerText = dataHeader.namaGuru || "[Nama Guru]";
      document.getElementById('txtMotto').innerText = dataHeader.motto ? `"${dataHeader.motto}"` : "[Motto]";
    }

    // MODAL CONTROL
    function bukaModalHeader() {
      const data = JSON.parse(localStorage.getItem('headerGuruData')) || {};
      document.getElementById('inputNamaSekolah').value = data.sekolah || "";
      document.getElementById('inputNamaGuru').value = data.namaGuru || "";
      document.getElementById('inputMotto').value = data.motto || "";
      document.getElementById('modalHeader').classList.remove('hidden');
    }

    function tutupModalHeader() {
      document.getElementById('modalHeader').classList.add('hidden');
    }

    function simpanHeaderModal() {
      const fileFoto = document.getElementById('inputFotoModal').files[0];
      
      const simpanTeks = () => {
        const dataBaru = {
          sekolah: document.getElementById('inputNamaSekolah').value.trim(),
          namaGuru: document.getElementById('inputNamaGuru').value.trim(),
          motto: document.getElementById('inputMotto').value.trim()
        };
        localStorage.setItem('headerGuruData', JSON.stringify(dataBaru));
        muatHeader();
        tutupModalHeader();
      };

      if (fileFoto) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          localStorage.setItem('fotoGuruURL', evt.target.result);
          simpanTeks();
        };
        reader.readAsDataURL(fileFoto);
      } else {
        simpanTeks();
      }
    }

    // JAM DIGITAL REALTIME
    function updateClock() {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
      if(document.getElementById('realtimeClock')) document.getElementById('realtimeClock').innerText = `🕒 ${timeStr}`;
      if(document.getElementById('realtimeDate')) document.getElementById('realtimeDate').innerText = dateStr;
    }

    window.addEventListener('DOMContentLoaded', () => {
      muatHeader();
      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>
</body>
</html>
