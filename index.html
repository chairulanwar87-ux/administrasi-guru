<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi Digital Guru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">
        
        <!-- HEADER UTAMA -->
        <header class="p-3 md:p-4">
            <div class="max-w-7xl mx-auto glass-header rounded-2xl p-3 md:p-4 shadow-xl flex flex-wrap items-center justify-between gap-4">
                
                <!-- PROFIL & IDENTITAS -->
                <div class="flex items-center gap-3">
                    <!-- Foto Profil (Bisa Diklik Untuk Ubah Link Foto) -->
                    <div class="relative group cursor-pointer" onclick="ubahFoto()" title="Klik untuk ubah foto">
                        <img id="headerFoto" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250" class="w-12 h-12 md:w-14 md:h-14 rounded-full border-2 border-indigo-600 object-cover shadow-md">
                        <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-[10px] font-bold">Ubah</div>
                    </div>

                    <div>
                        <h1 class="text-base md:text-xl font-black text-blue-600 tracking-wide uppercase leading-tight">
                            ADMINISTRASI DIGITAL GURU
                        </h1>
                        
                        <!-- Teks Info (Bisa Diklik Pengguna Langsung untuk Edit) -->
                        <div onclick="editProfilLangsung()" class="cursor-pointer hover:bg-slate-200/60 p-1 -ml-1 rounded-lg transition" title="Klik untuk edit Nama / Sekolah / Motto">
                            <p class="text-xs md:text-sm font-bold text-slate-800 tracking-tight flex items-center gap-1">
                                <span id="dispSekolah">SD NEGERI 1 GUWA LOR</span> • 
                                <span id="dispGuru">CHAIRUL ANWAR, S.Pd</span> • 
                                "<span id="dispMotto" class="italic">BERGELORA</span>"
                                <i data-lucide="pencil" class="w-3 h-3 text-indigo-600 ml-1"></i>
                            </p>
                        </div>

                        <div class="flex items-center gap-2 mt-0.5 text-[11px] font-semibold text-slate-600">
                            <span class="flex items-center gap-1 text-blue-600 font-bold">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i> <span id="jamDigital">16.00.00</span>
                            </span>
                            <span>•</span>
                            <span id="tanggalDigital">Minggu, 26 Juli 2026</span>
                            <span id="headerTA" class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md font-bold ml-1">Sem. Ganjil • 2026/2027</span>
                        </div>
                    </div>
                </div>

                <!-- MENU KANAN -->
                <div class="flex items-center gap-2 ml-auto">
                    <button onclick="editProfilLangsung()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                        <i data-lucide="user-cog" class="w-4 h-4"></i> Ubah Profil Saya
                    </button>
                    <a href="pengaturan.html" class="p-2 bg-white hover:bg-slate-100 rounded-xl border border-slate-300 text-slate-700 shadow-sm transition" title="Pengaturan Lanjutan">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                    </a>
                </div>

            </div>
        </header>

        <!-- MENU DASHBOARD -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-2 md:grid-cols-4 gap-4">
            <a href="siswa.html" class="glass-header p-5 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center">
                <div class="p-3 bg-blue-500 text-white rounded-xl mb-2"><i data-lucide="users" class="w-6 h-6"></i></div>
                <span class="font-bold text-sm text-slate-800">Data Siswa</span>
            </a>
            <a href="nilai.html" class="glass-header p-5 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center">
                <div class="p-3 bg-emerald-500 text-white rounded-xl mb-2"><i data-lucide="graduation-cap" class="w-6 h-6"></i></div>
                <span class="font-bold text-sm text-slate-800">Input Nilai</span>
            </a>
            <a href="rekap.html" class="glass-header p-5 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center">
                <div class="p-3 bg-amber-500 text-white rounded-xl mb-2"><i data-lucide="calendar-check" class="w-6 h-6"></i></div>
                <span class="font-bold text-sm text-slate-800">Absensi Siswa</span>
            </a>
            <a href="rapor.html" class="glass-header p-5 rounded-2xl shadow-lg hover:scale-[1.02] transition flex flex-col items-center justify-center text-center">
                <div class="p-3 bg-rose-500 text-white rounded-xl mb-2"><i data-lucide="file-spreadsheet" class="w-6 h-6"></i></div>
                <span class="font-bold text-sm text-slate-800">Cetak Rapor</span>
            </a>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // 1. BUKA POPUP UNTUK EDIT NAMA, SEKOLAH, & MOTTO
        function editProfilLangsung() {
            const profilLama = JSON.parse(localStorage.getItem('profilSekolahGuru')) || {
                namaSekolah: "SD NEGERI 1 GUWA LOR",
                namaGuru: "CHAIRUL ANWAR, S.Pd",
                motto: "BERGELORA"
            };

            const sekolahBaru = prompt("Masukkan Nama Sekolah Anda:", profilLama.namaSekolah);
            if (sekolahBaru === null) return;

            const guruBaru = prompt("Masukkan Nama Lengkap & Gelar Anda:", profilLama.namaGuru);
            if (guruBaru === null) return;

            const mottoBaru = prompt("Masukkan Motto Anda / Sekolah:", profilLama.motto);
            if (mottoBaru === null) return;

            profilLama.namaSekolah = sekolahBaru;
            profilLama.namaGuru = guruBaru;
            profilLama.motto = mottoBaru;

            localStorage.setItem('profilSekolahGuru', JSON.stringify(profilLama));
            tampilkanData();
            alert("Profil berhasil diperbarui!");
        }

        // 2. BUKA POPUP EDIT LINK FOTO PROFIL
        function ubahFoto() {
            const profilLama = JSON.parse(localStorage.getItem('profilSekolahGuru')) || {};
            const fotoBaru = prompt("Masukkan URL/Link Foto Profil Anda:", profilLama.foto || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250");
            
            if (fotoBaru !== null) {
                profilLama.foto = fotoBaru;
                localStorage.setItem('profilSekolahGuru', JSON.stringify(profilLama));
                tampilkanData();
            }
        }

        // 3. TAMPILKAN DATA KE HEADER
        function tampilkanData() {
            const profil = JSON.parse(localStorage.getItem('profilSekolahGuru')) || {
                namaSekolah: "SD NEGERI 1 GUWA LOR",
                namaGuru: "CHAIRUL ANWAR, S.Pd",
                motto: "BERGELORA",
                foto: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250"
            };

            document.getElementById('dispSekolah').innerText = profil.namaSekolah || "SD NEGERI 1 GUWA LOR";
            document.getElementById('dispGuru').innerText = profil.namaGuru || "CHAIRUL ANWAR, S.Pd";
            document.getElementById('dispMotto').innerText = profil.motto || "BERGELORA";
            if (profil.foto) document.getElementById('headerFoto').src = profil.foto;
        }

        // 4. JAM DIGITAL
        function updateJam() {
            const now = new Date();
            document.getElementById('jamDigital').innerText = `${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}.${String(now.getSeconds()).padStart(2,'0')}`;
            document.getElementById('tanggalDigital').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            tampilkanData();
            updateJam();
            setInterval(updateJam, 1000);
        });
    </script>
</body>
</html>
