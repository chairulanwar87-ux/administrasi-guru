<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Data Siswa - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- XLSX / SheetJS Library untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- HEADER / NAVBAR -->
        <header class="p-4 md:px-8">
            <div class="max-w-5xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i> KELOLA DATA SISWA
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-5xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            
            <!-- FORM INPUT SISWA BARU -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4 text-indigo-600"></i> Tambah Siswa Baru
                </h2>
                <form id="formSiswa" onsubmit="tambahSiswa(event)" class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="nisnSiswa" placeholder="Masukkan NISN Siswa" required class="w-full md:w-48 px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                    <input type="text" id="namaSiswa" placeholder="Masukkan Nama Lengkap Siswa" required class="flex-1 px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                    <select id="jkSiswa" class="w-full md:w-40 px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold text-slate-800">
                        <option value="L">Laki-Laki (L)</option>
                        <option value="P">Perempuan (P)</option>
                    </select>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2 whitespace-nowrap">
                        <i data-lucide="plus" class="w-4 h-4"></i> SIMPAN SISWA
                    </button>
                </form>
            </div>

            <!-- TABEL DAFTAR SISWA TERSIMPAN -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                    <div class="flex items-center gap-2">
                        <h2 class="text-base font-bold text-slate-800">Daftar Siswa Tersimpan</h2>
                        <span id="totalSiswa" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">0 Siswa</span>
                    </div>
                    <!-- TOMBOL DOWNLOAD / EXPORT EXCEL -->
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> EXPORT EXCEL
                    </button>
                </div>

                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table id="tabelSiswa" class="w-full text-xs text-left text-slate-700 bg-white/70">
                        <thead class="text-xs text-slate-800 uppercase bg-slate-200/80 border-b border-slate-300">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-center w-12">NO</th>
                                <th scope="col" class="px-4 py-3 w-40">NISN</th>
                                <th scope="col" class="px-4 py-3">NAMA SISWA</th>
                                <th scope="col" class="px-4 py-3 text-center w-24">L/P</th>
                                <th scope="col" class="px-4 py-3 text-center w-20">AKSI</th>
                            </tr>
                        </thead>
                        <tbody id="tabelSiswaBody" class="divide-y divide-slate-200">
                            <!-- Data otomatis diisi via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <!-- SCRIPT LOGIKA LOCALSTORAGE & EXPORT EXCEL -->
    <script>
        lucide.createIcons();

        // 1. Ambil data Siswa dari LocalStorage (atau default jika kosong)
        let daftarSiswa = JSON.parse(localStorage.getItem('dataSiswaGuru')) || [
            { id: 1, nisn: "0012345678", nama: "Ahmad Fauzi", jk: "L" },
            { id: 2, nisn: "0012345679", nama: "Biti Anisa", jk: "P" },
            { id: 3, nisn: "0012345680", nama: "Citra Lestari", jk: "P" }
        ];

        // 2. Render Data ke Tabel
        function renderTabel() {
            const tbody = document.getElementById('tabelSiswaBody');
            tbody.innerHTML = '';

            if (daftarSiswa.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-500">Belum ada data siswa. Silahkan tambah di atas.</td></tr>`;
            } else {
                daftarSiswa.forEach((siswa, index) => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-100/50">
                            <td class="px-4 py-3 text-center font-bold">${index + 1}</td>
                            <td class="px-4 py-3 font-semibold text-slate-700">${siswa.nisn || '-'}</td>
                            <td class="px-4 py-3 font-semibold text-slate-900">${siswa.nama}</td>
                            <td class="px-4 py-3 text-center font-bold text-indigo-600">${siswa.jk}</td>
                            <td class="px-4 py-3 text-center">
                                <button onclick="hapusSiswa(${index})" class="bg-rose-500 hover:bg-rose-600 text-white p-1.5 rounded-lg transition" title="Hapus">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('totalSiswa').innerText = `${daftarSiswa.length} Siswa`;
            localStorage.setItem('dataSiswaGuru', JSON.stringify(daftarSiswa));
            lucide.createIcons();
        }

        // 3. Tambah Siswa Baru
        function tambahSiswa(event) {
            event.preventDefault();
            const nisn = document.getElementById('nisnSiswa').value.trim();
            const nama = document.getElementById('namaSiswa').value.trim();
            const jk = document.getElementById('jkSiswa').value;

            if (nama) {
                daftarSiswa.push({ id: Date.now(), nisn: nisn, nama: nama, jk: jk });
                document.getElementById('nisnSiswa').value = '';
                document.getElementById('namaSiswa').value = '';
                renderTabel();
            }
        }

        // 4. Hapus Siswa
        function hapusSiswa(index) {
            if (confirm("Yakin ingin menghapus siswa ini?")) {
                daftarSiswa.splice(index, 1);
                renderTabel();
            }
        }

        // 5. Export Data Siswa ke File Excel (.xlsx)
        function exportExcel() {
            if (daftarSiswa.length === 0) {
                alert("Tidak ada data siswa untuk di-export!");
                return;
            }

            const dataExport = daftarSiswa.map((siswa, index) => ({
                "No": index + 1,
                "NISN": siswa.nisn || "-",
                "Nama Siswa": siswa.nama,
                "Jenis Kelamin": siswa.jk === "L" ? "Laki-Laki" : "Perempuan"
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data Siswa");

            XLSX.writeFile(workbook, "Data_Siswa_Kelas.xlsx");
        }

        // Jalankan saat halaman dibuka
        renderTabel();
    </script>
</body>
</html>
