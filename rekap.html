<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absen - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Library SheetJS untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-item {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Sembunyikan elemen dekorasi saat dicetak/PDF */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
            }
            .glass-card {
                background: white !important;
                border: none !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- HEADER / NAVBAR (Sembunyi saat cetak) -->
        <header class="p-4 md:px-8 no-print">
            <div class="max-w-5xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="clipboard-list" class="w-5 h-5 text-indigo-600"></i> REKAP ABSENSI SISWA
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-5xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            <div class="glass-card rounded-2xl p-6 md:p-8 shadow-xl">
                
                <!-- HEADER LAPORAN & TOMBOL EKSPOR -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-800">Laporan Rekap Absensi</h2>
                        <p class="text-xs text-slate-600">Rekapitulasi kehadiran siswa semester berjalan.</p>
                    </div>

                    <!-- TOMBOL EKSPOR (Sembunyi saat cetak) -->
                    <div class="flex gap-2 no-print">
                        <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Unduh Excel
                        </button>
                        <button onclick="window.print()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                            <i data-lucide="printer" class="w-4 h-4"></i> Cetak / PDF
                        </button>
                    </div>
                </div>

                <!-- TABEL DATA ABSENSI -->
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table id="tabelSiswa" class="w-full text-xs text-left text-slate-700 bg-white/70">
                        <thead class="text-xs text-slate-800 uppercase bg-slate-200/80 border-b border-slate-300">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-center">No</th>
                                <th scope="col" class="px-4 py-3">Nama Siswa</th>
                                <th scope="col" class="px-4 py-3 text-center">Hadir (H)</th>
                                <th scope="col" class="px-4 py-3 text-center">Izin (I)</th>
                                <th scope="col" class="px-4 py-3 text-center">Sakit (S)</th>
                                <th scope="col" class="px-4 py-3 text-center">Alpa (A)</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                            <tr class="hover:bg-slate-100/50">
                                <td class="px-4 py-3 text-center font-bold">1</td>
                                <td class="px-4 py-3 font-semibold text-slate-900">Ahmad Fauzi</td>
                                <td class="px-4 py-3 text-center text-emerald-600 font-bold">18</td>
                                <td class="px-4 py-3 text-center text-blue-600 font-bold">1</td>
                                <td class="px-4 py-3 text-center text-amber-600 font-bold">0</td>
                                <td class="px-4 py-3 text-center text-rose-600 font-bold">0</td>
                            </tr>
                            <tr class="hover:bg-slate-100/50">
                                <td class="px-4 py-3 text-center font-bold">2</td>
                                <td class="px-4 py-3 font-semibold text-slate-900">Biti Anisa</td>
                                <td class="px-4 py-3 text-center text-emerald-600 font-bold">19</td>
                                <td class="px-4 py-3 text-center text-blue-600 font-bold">0</td>
                                <td class="px-4 py-3 text-center text-amber-600 font-bold">0</td>
                                <td class="px-4 py-3 text-center text-rose-600 font-bold">0</td>
                            </tr>
                            <tr class="hover:bg-slate-100/50">
                                <td class="px-4 py-3 text-center font-bold">3</td>
                                <td class="px-4 py-3 font-semibold text-slate-900">Citra Lestari</td>
                                <td class="px-4 py-3 text-center text-emerald-600 font-bold">16</td>
                                <td class="px-4 py-3 text-center text-blue-600 font-bold">1</td>
                                <td class="px-4 py-3 text-center text-amber-600 font-bold">2</td>
                                <td class="px-4 py-3 text-center text-rose-600 font-bold">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium no-print">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <!-- SCRIPT JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // Fungsi Download Excel
        function exportExcel() {
            var tabel = document.getElementById("tabelSiswa"); 
            var wb = XLSX.utils.table_to_book(tabel, { sheet: "Rekap Absen" });
            XLSX.writeFile(wb, "Rekap_Absensi_Siswa.xlsx");
        }
    </script>
</body>
</html>
