<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - Administrasi Guru</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> Pengaturan Aplikasi
            </h1>
            <a href="index.html" class="inline-flex items-center gap-2 bg-indigo-700 hover:bg-indigo-800 text-white px-4 py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-8 flex-1 w-full space-y-6">

        <!-- Profil Guru / Identitas -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-gear text-indigo-600"></i> Identitas Guru & Sekolah
            </h2>
            <form class="space-y-4" onsubmit="event.preventDefault(); alert('Pengaturan berhasil disimpan!');">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap Guru</label>
                        <input type="text" placeholder="Masukkan nama & gelar" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">NIP / NUPTK</label>
                        <input type="text" placeholder="Masukkan NIP/NUPTK" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Sekolah / Instansi</label>
                        <input type="text" placeholder="Masukkan nama sekolah" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Tahun Ajaran</label>
                        <input type="text" placeholder="Contoh: 2024/2025" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div class="pt-2 flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Identitas
                    </button>
                </div>
            </form>
        </div>

        <!-- Manajemen Data & Backup -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-database text-indigo-600"></i> Backup & Cadangan Data
            </h2>
            <p class="text-sm text-slate-600 mb-4">
                Cadangkan data administrasi Anda secara lokal agar aman atau muat ulang data cadangan sebelumnya.
            </p>
            <div class="flex flex-wrap gap-3">
                <button onclick="alert('Fitur cadangkan data aktif')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Ekspor / Backup Data
                </button>
                <button onclick="alert('Fitur impor data aktif')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm border border-slate-300 transition flex items-center gap-2">
                    <i class="fa-solid fa-upload"></i> Impor / Restore Data
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-200 bg-white">
        &copy; Aplikasi Administrasi Guru.
    </footer>

</body>
</html>
