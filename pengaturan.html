<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- NAVIGATION / HEADER -->
        <header class="p-4 md:px-8">
            <div class="max-w-4xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5 text-indigo-600"></i> PENGATURAN APLIKASI
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="max-w-4xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            
            <!-- Form Identitas -->
            <div class="glass-card rounded-2xl p-6 md:p-8 shadow-xl">
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-300/60 pb-3">
                    <i data-lucide="user-check" class="w-4 h-4 text-indigo-600"></i> Identitas Guru & Sekolah
                </h2>
                <form class="space-y-4" onsubmit="event.preventDefault(); alert('Pengaturan berhasil disimpan!');">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap Guru</label>
                            <input type="text" placeholder="Nama & Gelar" class="w-full px-3 py-2 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">NIP / NUPTK</label>
                            <input type="text" placeholder="Nomor NIP/NUPTK" class="w-full px-3 py-2 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-medium">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nama Sekolah</label>
                            <input type="text" placeholder="Nama Instansi/Sekolah" class="w-full px-3 py-2 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Tahun Ajaran</label>
                            <input type="text" placeholder="Contoh: 2025/2026" class="w-full px-3 py-2 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-medium">
                        </div>
                    </div>

                    <div class="pt-2 flex justify-end">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> SIMPAN PENGATURAN
                        </button>
                    </div>
                </form>
            </div>

            <!-- Backup Data -->
            <div class="glass-card rounded-2xl p-6 md:p-8 shadow-xl">
                <h2 class="text-base font-bold text-slate-800 mb-2 flex items-center gap-2">
                    <i data-lucide="database" class="w-4 h-4 text-indigo-600"></i> Cadangan Data (Backup)
                </h2>
                <p class="text-xs text-slate-600 mb-4">Simpan atau pulihkan file cadangan administrasi guru.</p>
                <div class="flex flex-wrap gap-2">
                    <button onclick="alert('Cadangan data berhasil diunduh!')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> UNDUH CADANGAN
                    </button>
                    <button onclick="alert('Silahkan pilih file backup.')" class="bg-white/80 hover:bg-white text-slate-700 font-bold px-4 py-2 rounded-xl text-xs border border-slate-300 transition shadow-sm flex items-center gap-2">
                        <i data-lucide="upload" class="w-4 h-4"></i> RESTORE DATA
                    </button>
                </div>
            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
