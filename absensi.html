<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen Harian - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- HEADER / NAVBAR -->
        <header class="p-4 md:px-8">
            <div class="max-w-5xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i> PRESENSI & ABSENSI HARIAN
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-5xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            
            <!-- PANEL KONTROL TANGGAL & SIMPAN -->
            <div class="glass-card rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <label class="text-xs font-bold text-slate-700 whitespace-nowrap">Tanggal Absen:</label>
                    <input type="date" id="tanggalAbsen" class="px-3 py-2 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-bold text-slate-800">
                </div>
                <button onclick="simpanAbsensi()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> SIMPAN ABSENSI
                </button>
            </div>

            <!-- TABEL INPUT ABSENSI -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-800">Daftar Presensi Siswa</h2>
                    <span id="infoTanggal" class="text-xs font-bold text-slate-600"></span>
                </div>

                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-xs text-left text-slate-700 bg-white/70">
                        <thead class="text-xs text-slate-800 uppercase bg-slate-200/80 border-b border-slate-300">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-center">No</th>
                                <th scope="col" class="px-4 py-3">Nama Siswa</th>
                                <th scope="col" class="px-4 py-3 text-center">Status Kehadiran</th>
                            </tr>
                        </thead>
                        <tbody id="tabelAbsenBody" class="divide-y divide-slate-200">
                            <!-- Data otomatis diambil dari daftarSiswa di LocalStorage -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <!-- SCRIPT LOGIKA ABSENSI -->
    <script>
        lucide.createIcons();

        // 1. Set Tanggal Hari Ini secara otomatis
        const dateInput = document.getElementById('tanggalAbsen');
        dateInput.valueAsDate = new Date();

        // 2. Ambil data siswa dari LocalStorage (terhubung dengan siswa.html)
        const daftarSiswa = JSON.parse(localStorage.getItem('dataSiswaGuru')) || [
            { id: 1, nama: "Ahmad Fauzi", jk: "L" },
            { id: 2, nama: "Biti Anisa", jk: "P" },
            { id: 3, nama: "Citra Lestari", jk: "P" }
        ];

        // 3. Render Tabel Absensi
        function renderAbsen() {
            const tbody = document.getElementById('tabelAbsenBody');
            tbody.innerHTML = '';

            if (daftarSiswa.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-500">Belum ada data siswa. Tambahkan siswa terlebih dahulu di menu Data Siswa.</td></tr>`;
                return;
            }

            daftarSiswa.forEach((siswa, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-100/50">
                        <td class="px-4 py-3 text-center font-bold">${index + 1}</td>
                        <td class="px-4 py-3 font-semibold text-slate-900">${siswa.nama}</td>
                        <td class="px-4 py-3 text-center">
                            <select id="status-${siswa.id}" class="px-3 py-1.5 glass-input rounded-lg font-bold text-xs focus:outline-none">
                                <option value="H" class="text-emerald-600">Hadir (H)</option>
                                <option value="I" class="text-blue-600">Izin (I)</option>
                                <option value="S" class="text-amber-600">Sakit (S)</option>
                                <option value="A" class="text-rose-600">Alpa (A)</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        // 4. Fungsi Simpan Kehadiran ke LocalStorage
        function simpanAbsensi() {
            const tgl = dateInput.value;
            if (!tgl) {
                alert("Pilih tanggal terlebih dahulu!");
                return;
            }

            let rekapAbsen = JSON.parse(localStorage.getItem('rekapAbsenGuru')) || {};
            rekapAbsen[tgl] = [];

            daftarSiswa.forEach(siswa => {
                const status = document.getElementById(`status-${siswa.id}`).value;
                rekapAbsen[tgl].push({
                    id: siswa.id,
                    nama: siswa.nama,
                    status: status
                });
            });

            localStorage.setItem('rekapAbsenGuru', JSON.stringify(rekapAbsen));
            alert(`Presensi tanggal ${tgl} berhasil disimpan!`);
        }

        // Jalankan saat pertama dimuat
        renderAbsen();
    </script>
</body>
</html>
