<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Siswa - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- XLSX / SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }

        /* Styling Pilihan Absen Modern (Chips/Badges) */
        .status-btn {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            user-select: none;
        }

        /* STYLING DICETAK PDF */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .glass-card {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            #areaCetak {
                width: 100% !important;
                margin: 0 !important;
            }
            table {
                border-collapse: collapse !important;
                width: 100% !important;
            }
            th, td {
                border: 1px solid #000 !important;
                padding: 8px !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- HEADER / NAVBAR -->
        <header class="p-4 md:px-8 no-print">
            <div class="max-w-5xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="clipboard-check" class="w-5 h-5 text-indigo-600"></i> PRESENSI / ABSENSI SISWA
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-5xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">

            <!-- AREA TABEL ABSENSI -->
            <div id="areaCetak" class="glass-card rounded-2xl p-6 shadow-xl">
                
                <!-- JUDUL CETAK PDF -->
                <div class="hidden print:block text-center mb-6">
                    <h1 class="text-xl font-bold uppercase tracking-wider">REKAPITULASI PRESENSI SISWA</h1>
                    <p id="printTanggal" class="text-xs text-gray-600 mt-1"></p>
                    <hr class="border-black mt-2">
                </div>

                <!-- HEADER DALAM KARTU (NO-PRINT) -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 no-print">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">Daftar Kehadiran Siswa</h2>
                        <p class="text-xs text-slate-600">Pilih status kehadiran siswa dengan sekali klik pada tombol warna.</p>
                    </div>

                    <!-- PILIHAN TANGGAL & ACTION -->
                    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <input type="date" id="tglAbsen" class="px-3 py-2 glass-input rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="muatAbsen()">
                        
                        <button onclick="simpanAbsen()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-1.5">
                            <i data-lucide="save" class="w-4 h-4"></i> SIMPAN
                        </button>
                        <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-1.5">
                            <i data-lucide="download" class="w-4 h-4"></i> Unduh Excel
                        </button>
                        <button onclick="cetakPDF()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-2 rounded-xl text-xs transition shadow-md flex items-center gap-1.5">
                            <i data-lucide="printer" class="w-4 h-4"></i> Cetak / PDF
                        </button>
                    </div>
                </div>

                <!-- TABEL DATA ABSENSI -->
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-xs text-left text-slate-700 bg-white/70">
                        <thead class="text-xs text-slate-800 uppercase bg-slate-200/80 border-b border-slate-300">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-center w-12">NO</th>
                                <th scope="col" class="px-4 py-3">NAMA SISWA</th>
                                <th scope="col" class="px-4 py-3 text-center w-72">STATUS KEHADIRAN</th>
                            </tr>
                        </thead>
                        <tbody id="tabelAbsenBody" class="divide-y divide-slate-200">
                            <!-- Data otomatis diisi via JS -->
                        </tbody>
                    </table>
                </div>

            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium no-print">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <!-- SCRIPT LOGIKA JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // Set tanggal default hari ini (Format YYYY-MM-DD)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('tglAbsen').value = today;

        // Ambil Data Siswa & Rekap Absen dari LocalStorage
        let dataSiswa = JSON.parse(localStorage.getItem('dataSiswaGuru')) || [
            { id: 1, nama: "ABID FADHIL ABYAN" },
            { id: 2, nama: "AFAN ATMA PURNAMA" },
            { id: 3, nama: "AFIF FACHRUDIN" },
            { id: 4, nama: "AHMAD FERDIANSYAH" }
        ];

        let rekapAbsen = JSON.parse(localStorage.getItem('rekapAbsenGuru')) || {};

        // Render Tabel Absen
        function muatAbsen() {
            const tgl = document.getElementById('tglAbsen').value;
            const tbody = document.getElementById('tabelAbsenBody');
            tbody.innerHTML = '';

            if (dataSiswa.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-500">Belum ada data siswa. Silahkan isi di menu Data Siswa terlebih dahulu.</td></tr>`;
                return;
            }

            const dataHariIni = rekapAbsen[tgl] || {};

            dataSiswa.forEach((siswa, index) => {
                const status = dataHariIni[siswa.id] || 'H'; // Default Hadir (H)

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-100/50">
                        <td class="px-4 py-3 text-center font-bold">${index + 1}</td>
                        <td class="px-4 py-3 font-semibold text-slate-900">${siswa.nama}</td>
                        <td class="px-4 py-3 text-center">
                            <!-- PILIHAN ABSEN MODERN (CHIPS) -->
                            <div class="inline-flex p-1 bg-slate-200/80 rounded-xl gap-1 no-print">
                                <button type="button" onclick="pilihStatus(${siswa.id}, 'H')" id="btn-${siswa.id}-H"
                                    class="status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold ${status === 'H' ? 'bg-emerald-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                    Hadir (H)
                                </button>
                                <button type="button" onclick="pilihStatus(${siswa.id}, 'I')" id="btn-${siswa.id}-I"
                                    class="status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold ${status === 'I' ? 'bg-sky-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                    Izin (I)
                                </button>
                                <button type="button" onclick="pilihStatus(${siswa.id}, 'S')" id="btn-${siswa.id}-S"
                                    class="status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold ${status === 'S' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                    Sakit (S)
                                </button>
                                <button type="button" onclick="pilihStatus(${siswa.id}, 'A')" id="btn-${siswa.id}-A"
                                    class="status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold ${status === 'A' ? 'bg-rose-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                    Alpha (A)
                                </button>
                            </div>

                            <!-- TAMPILAN KHUSUS PRINT PDF -->
                            <span class="hidden print:inline-block font-bold text-xs uppercase px-3 py-1 border rounded">
                                ${formatStatusLengkap(status)}
                            </span>
                        </td>
                    </tr>
                `;
            });

            lucide.createIcons();
        }

        // Format Status untuk Cetak
        function formatStatusLengkap(code) {
            if (code === 'H') return 'Hadir';
            if (code === 'I') return 'Izin';
            if (code === 'S') return 'Sakit';
            if (code === 'A') return 'Alpha';
            return 'Hadir';
        }

        // Pilih Status saat Klik
        function pilihStatus(siswaId, status) {
            const tgl = document.getElementById('tglAbsen').value;
            if (!rekapAbsen[tgl]) rekapAbsen[tgl] = {};
            
            rekapAbsen[tgl][siswaId] = status;

            // Reset Gaya Tombol pada Baris Ini
            ['H', 'I', 'S', 'A'].forEach(st => {
                const btn = document.getElementById(`btn-${siswaId}-${st}`);
                if (btn) {
                    btn.className = "status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold text-slate-600 hover:text-slate-900";
                }
            });

            // Aktifkan Tombol yang Dipilih dengan Warna Khas
            const activeBtn = document.getElementById(`btn-${siswaId}-${status}`);
            if (activeBtn) {
                if (status === 'H') activeBtn.className = "status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold bg-emerald-500 text-white shadow-sm";
                if (status === 'I') activeBtn.className = "status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold bg-sky-500 text-white shadow-sm";
                if (status === 'S') activeBtn.className = "status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold bg-amber-500 text-white shadow-sm";
                if (status === 'A') activeBtn.className = "status-btn px-3 py-1.5 rounded-lg text-[11px] font-extrabold bg-rose-500 text-white shadow-sm";
            }

            // Simpan Otomatis ke LocalStorage
            localStorage.setItem('rekapAbsenGuru', JSON.stringify(rekapAbsen));
        }

        // Simpan Manual Button
        function simpanAbsen() {
            localStorage.setItem('rekapAbsenGuru', JSON.stringify(rekapAbsen));
            alert("Data absensi berhasil disimpan!");
        }

        // Export Excel
        function exportExcel() {
            const tgl = document.getElementById('tglAbsen').value;
            if (dataSiswa.length === 0) {
                alert("Tidak ada data absensi untuk diexport!");
                return;
            }

            const dataHariIni = rekapAbsen[tgl] || {};

            const dataExport = dataSiswa.map((siswa, index) => ({
                "NO": index + 1,
                "NAMA SISWA": siswa.nama,
                "TANGGAL": tgl,
                "STATUS KEHADIRAN": formatStatusLengkap(dataHariIni[siswa.id] || 'H')
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Absensi Siswa");

            XLSX.writeFile(workbook, `Absensi_Siswa_${tgl}.xlsx`);
        }

        // Cetak PDF
        function cetakPDF() {
            const tgl = document.getElementById('tglAbsen').value;
            document.getElementById('printTanggal').innerText = `Tanggal: ${tgl}`;
            window.print();
        }

        // Jalankan saat dimuat
        muatAbsen();
    </script>
</body>
</html>
