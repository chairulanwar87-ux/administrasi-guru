<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perangkat Ajar - Administrasi Digital Guru</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <style>
    body {
      background: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
    }

    .glass-inner {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .glass-item {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body class="p-3 md:p-5 min-h-screen text-slate-800">

  <!-- NAVIGATION BAR -->
  <nav class="flex items-center gap-2 overflow-x-auto pb-2 mb-4 no-scrollbar">
    <a href="index.html" class="flex items-center gap-2 px-5 py-2.5 rounded-2xl glass-nav hover:bg-white text-slate-700 font-bold text-xs shadow-sm whitespace-nowrap">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i> DASHBOARD
    </a>
    <a href="absensi.html" class="flex items-center gap-2 px-5 py-2.5 rounded-2xl glass-nav hover:bg-white text-slate-700 font-bold text-xs shadow-sm whitespace-nowrap">
      <i data-lucide="calendar" class="w-4 h-4"></i> ABSEN HARIAN
    </a>
    <a href="modul.html" class="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-blue-600 text-white font-bold text-xs shadow-md whitespace-nowrap">
      <i data-lucide="folder" class="w-4 h-4"></i> RPP / MODUL
    </a>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="glass-card rounded-3xl p-6 space-y-6">
    
    <!-- HEADER -->
    <div class="flex items-center gap-3">
      <div class="p-3 bg-blue-600 text-white rounded-2xl">
        <i data-lucide="folder" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl font-black text-slate-800 uppercase tracking-tight">PERANGKAT AJAR (RPP / MODUL)</h1>
        <p class="text-xs text-slate-600 font-semibold">Arsip dan Tautan Modul Ajar Perangkat Pembelajaran.</p>
      </div>
    </div>

    <!-- GRID MODUL AJAR -->
    <div id="gridModul" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Item modul diisi otomatis oleh JS -->
    </div>

  </main>

  <!-- MODAL TAMBAH LINK MODUL -->
  <div id="modalTambah" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[999] p-4 hidden">
    <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-black text-slate-800 uppercase">Tambah Tautan Modul Ajar</h3>
        <button onclick="tutupModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Judul Modul / Mata Pelajaran</label>
          <input type="text" id="inputJudul" placeholder="Contoh: Modul Ajar Matematika - Bab 1" class="w-full border rounded-xl p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Keterangan / Kurikulum</label>
          <input type="text" id="inputSub" placeholder="Contoh: Kelas 4 • Kurikulum Merdeka" class="w-full border rounded-xl p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Link Website / Google Drive / Canva</label>
          <input type="url" id="inputLink" placeholder="https://drive.google.com/file/d/..." class="w-full border rounded-xl p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Warna Kartu</label>
          <select id="inputWarna" class="w-full border rounded-xl p-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
            <option value="blue">Biru (Matematika / Umum)</option>
            <option value="emerald">Hijau (IPAS / Sains)</option>
            <option value="purple">Ungu (Bahasa / Seni)</option>
            <option value="amber">Kuning / Amber (PPKn / Agama)</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <button onclick="tutupModal()" class="px-4 py-2.5 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 text-xs">Batal</button>
        <button onclick="simpanModul()" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-md text-xs">Simpan Tautan</button>
      </div>
    </div>
  </div>

  <script>
    const db = new Dexie('AdminGuruDB');
    db.version(3).stores({
      modulLink: '++id, judul, sub, link, warna'
    });

    async function seedModul() {
      const count = await db.modulLink.count();
      if (count === 0) {
        await db.modulLink.bulkAdd([
          {
            judul: 'Modul Ajar Matematika',
            sub: 'Kelas 4 • Kurikulum Merdeka',
            link: 'https://drive.google.com',
            warna: 'blue'
          },
          {
            judul: 'Modul Ajar IPAS',
            sub: 'Kelas 4 • Kurikulum Merdeka',
            link: 'https://drive.google.com',
            warna: 'emerald'
          }
        ]);
      }
    }

    async function loadModul() {
      const container = document.getElementById('gridModul');
      container.innerHTML = '';

      const listModul = await db.modulLink.toArray();

      // Render Kartu Modul
      listModul.forEach(m => {
        let themeBg = 'bg-blue-600 hover:bg-blue-700';
        let iconColor = 'text-blue-600';

        if (m.warna === 'emerald') {
          themeBg = 'bg-emerald-600 hover:bg-emerald-700';
          iconColor = 'text-emerald-600';
        } else if (m.warna === 'purple') {
          themeBg = 'bg-purple-600 hover:bg-purple-700';
          iconColor = 'text-purple-600';
        } else if (m.warna === 'amber') {
          themeBg = 'bg-amber-600 hover:bg-amber-700';
          iconColor = 'text-amber-600';
        }

        container.innerHTML += `
          <div class="glass-inner rounded-3xl p-6 flex flex-col justify-between items-center text-center shadow-sm hover:shadow-md transition relative group">
            <button onclick="hapusModul(${m.id})" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition" title="Hapus Modul">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>

            <div class="my-3">
              <i data-lucide="file-text" class="w-14 h-14 ${iconColor} mx-auto mb-3"></i>
              <h3 class="font-black text-slate-800 text-sm">${m.judul}</h3>
              <p class="text-[11px] font-semibold text-slate-500 mt-1">${m.sub}</p>
            </div>

            <a href="${m.link}" target="_blank" class="w-full ${themeBg} text-white font-bold text-xs py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm transition mt-4">
              <i data-lucide="external-link" class="w-4 h-4"></i> Buka Modul
            </a>
          </div>
        `;
      });

      // Kartu Tambah Modul Baru
      container.innerHTML += `
        <div onclick="bukaModal()" class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-3xl p-6 flex flex-col items-center justify-center cursor-pointer transition bg-white/30 hover:bg-white/60 min-h-[220px]">
          <i data-lucide="cloud-upload" class="w-10 h-10 text-slate-400 mb-2"></i>
          <span class="font-bold text-xs text-slate-600">+ Tambah Link Modul Baru</span>
        </div>
      `;

      lucide.createIcons();
    }

    function bukaModal() {
      document.getElementById('modalTambah').classList.remove('hidden');
    }

    function tutupModal() {
      document.getElementById('modalTambah').classList.add('hidden');
    }

    async function simpanModul() {
      const judul = document.getElementById('inputJudul').value;
      const sub = document.getElementById('inputSub').value || 'Kurikulum Merdeka';
      const link = document.getElementById('inputLink').value;
      const warna = document.getElementById('inputWarna').value;

      if (!judul || !link) {
        alert('Harap isi Judul dan Link Website!');
        return;
      }

      await db.modulLink.add({ judul, sub, link, warna });

      // Reset form
      document.getElementById('inputJudul').value = '';
      document.getElementById('inputSub').value = '';
      document.getElementById('inputLink').value = '';

      tutupModal();
      loadModul();
    }

    async function hapusModul(id) {
      if (confirm('Apakah Anda yakin ingin menghapus modul ini?')) {
        await db.modulLink.delete(id);
        loadModul();
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await seedModul();
      loadModul();
    });
  </script>
</body>
</html>
