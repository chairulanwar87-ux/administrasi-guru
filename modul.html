<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPP / Modul Ajar - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- HEADER / NAVBAR -->
        <header class="p-4 md:px-8">
            <div class="max-w-5xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="folder" class="w-5 h-5 text-indigo-600"></i> RPP & MODUL AJAR
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-5xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            
            <!-- FORM TAMBAH MODUL / LINK RPP -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i> Tambah Perangkat Ajar Baru
                </h2>
                <form id="formModul" onsubmit="tambahModul(event)" class="grid md:grid-cols-3 gap-3">
                    <input type="text" id="judulModul" placeholder="Judul Modul / RPP" required class="px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                    <input type="text" id="mapelModul" placeholder="Mata Pelajaran (misal: Matematika)" required class="px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                    <input type="url" id="linkModul" placeholder="Link File (Google Drive/PDF)" required class="px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                    
                    <div class="md:col-span-3 flex justify-end">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> SIMPAN PERANGKAT AJAR
                        </button>
                    </div>
                </form>
            </div>

            <!-- DAFTAR MODUL TERSEMPAN -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-800">Daftar Modul Ajar Tersimpan</h2>
                    <span id="totalModul" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">0 Modul</span>
                </div>

                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-xs text-left text-slate-700 bg-white/70">
                        <thead class="text-xs text-slate-800 uppercase bg-slate-200/80 border-b border-slate-300">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-center w-12">No</th>
                                <th scope="col" class="px-4 py-3">Judul Modul / RPP</th>
                                <th scope="col" class="px-4 py-3">Mata Pelajaran</th>
                                <th scope="col" class="px-4 py-3 text-center w-32">Akses File</th>
                                <th scope="col" class="px-4 py-3 text-center w-20">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelModulBody" class="divide-y divide-slate-200">
                            <!-- Data otomatis diisi lewat JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <!-- SCRIPT LOGIKA LOCALSTORAGE -->
    <script>
        lucide.createIcons();

        // 1. Data bawaan/awal modul
        let daftarModul = JSON.parse(localStorage.getItem('dataModulGuru')) || [
            { id: 1, judul: "Modul Ajar Bab 1 - Bilangan Celah", mapel: "Matematika", link: "https://drive.google.com" },
            { id: 2, judul: "RPP IPAS - Ekosistem Lingkungan", mapel: "IPAS", link: "https://drive.google.com" }
        ];

        // 2. Render Tabel
        function renderTabel() {
            const tbody = document.getElementById('tabelModulBody');
            tbody.innerHTML = '';

            if (daftarModul.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-500">Belum ada modul atau RPP yang disimpan.</td></tr>`;
            } else {
                daftarModul.forEach((modul, index) => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-100/50">
                            <td class="px-4 py-3 text-center font-bold">${index + 1}</td>
                            <td class="px-4 py-3 font-semibold text-slate-900">${modul.judul}</td>
                            <td class="px-4 py-3 font-medium text-slate-700">${modul.mapel}</td>
                            <td class="px-4 py-3 text-center">
                                <a href="${modul.link}" target="_blank" class="inline-flex items-center gap-1 px-3 py-1 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold transition text-[11px]">
                                    <i data-lucide="external-link" class="w-3 h-3"></i> Buka File
                                </a>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <button onclick="hapusModul(${index})" class="bg-rose-500 hover:bg-rose-600 text-white p-1.5 rounded-lg transition" title="Hapus">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('totalModul').innerText = `${daftarModul.length} Modul`;
            localStorage.setItem('dataModulGuru', JSON.stringify(daftarModul));
            lucide.createIcons();
        }

        // 3. Tambah Modul
        function tambahModul(event) {
            event.preventDefault();
            const judul = document.getElementById('judulModul').value.trim();
            const mapel = document.getElementById('mapelModul').value.trim();
            const link = document.getElementById('linkModul').value.trim();

            if (judul && mapel && link) {
                daftarModul.push({ id: Date.now(), judul: judul, mapel: mapel, link: link });
                document.getElementById('judulModul').value = '';
                document.getElementById('mapelModul').value = '';
                document.getElementById('linkModul').value = '';
                renderTabel();
            }
        }

        // 4. Hapus Modul
        function hapusModul(index) {
            if (confirm("Yakin ingin menghapus dokumen ini?")) {
                daftarModul.splice(index, 1);
                renderTabel();
            }
        }

        // Jalankan saat dimuat
        renderTabel();
    </script>
</body>
</html>
