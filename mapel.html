<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Pelajaran - Administrasi Guru</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col bg-cover bg-center bg-fixed" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920');">

    <div class="min-h-screen flex flex-col bg-slate-900/40 backdrop-blur-[2px]">

        <!-- HEADER / NAVBAR -->
        <header class="p-4 md:px-8">
            <div class="max-w-5xl mx-auto flex justify-between items-center glass-card rounded-2xl p-4 shadow-lg">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-indigo-600"></i> KELOLA MATA PELAJARAN
                </h1>
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> KEMBALI
                </a>
            </div>
        </header>

        <!-- CONTENT UTAMA -->
        <main class="max-w-5xl mx-auto px-4 md:px-8 py-4 flex-1 w-full space-y-4">
            
            <!-- FORM INPUT MAPEL BARU -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i> Tambah Mata Pelajaran
                </h2>
                <form id="formMapel" onsubmit="tambahMapel(event)" class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="namaMapel" placeholder="Masukkan Nama Mata Pelajaran (misal: Matematika)" required class="flex-1 px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold">
                    <input type="text" id="kkmMapel" placeholder="KKM (misal: 75)" required class="w-full md:w-32 px-4 py-2.5 glass-input rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-semibold text-center">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> SIMPAN MAPEL
                    </button>
                </form>
            </div>

            <!-- TABEL DAFTAR MAPEL -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-800">Daftar Mata Pelajaran</h2>
                    <span id="totalMapel" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">0 Mapel</span>
                </div>

                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-xs text-left text-slate-700 bg-white/70">
                        <thead class="text-xs text-slate-800 uppercase bg-slate-200/80 border-b border-slate-300">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-center w-12">No</th>
                                <th scope="col" class="px-4 py-3">Mata Pelajaran</th>
                                <th scope="col" class="px-4 py-3 text-center w-24">KKM</th>
                                <th scope="col" class="px-4 py-3 text-center w-20">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelMapelBody" class="divide-y divide-slate-200">
                            <!-- Data otomatis diisi via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <footer class="text-center py-4 text-xs text-white/80 font-medium">
            &copy; Aplikasi Administrasi Guru
        </footer>
    </div>

    <!-- SCRIPT LOGIKA LOCALSTORAGE -->
    <script>
        lucide.createIcons();

        // 1. Ambil data Mapel dari LocalStorage
        let daftarMapel = JSON.parse(localStorage.getItem('dataMapelGuru')) || [
            { id: 1, nama: "Pendidikan Agama", kkm: "75" },
            { id: 2, nama: "Pancasila & KWN", kkm: "75" },
            { id: 3, nama: "Bahasa Indonesia", kkm: "70" },
            { id: 4, nama: "Matematika", kkm: "70" }
        ];

        // 2. Render Data ke Tabel
        function renderTabel() {
            const tbody = document.getElementById('tabelMapelBody');
            tbody.innerHTML = '';

            if (daftarMapel.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-500">Belum ada mata pelajaran. Silahkan tambah di atas.</td></tr>`;
            } else {
                daftarMapel.forEach((mapel, index) => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-100/50">
                            <td class="px-4 py-3 text-center font-bold">${index + 1}</td>
                            <td class="px-4 py-3 font-semibold text-slate-900">${mapel.nama}</td>
                            <td class="px-4 py-3 text-center font-bold text-indigo-600">${mapel.kkm}</td>
                            <td class="px-4 py-3 text-center">
                                <button onclick="hapusMapel(${index})" class="bg-rose-500 hover:bg-rose-600 text-white p-1.5 rounded-lg transition" title="Hapus">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('totalMapel').innerText = `${daftarMapel.length} Mapel`;
            localStorage.setItem('dataMapelGuru', JSON.stringify(daftarMapel));
            lucide.createIcons();
        }

        // 3. Tambah Mapel
        function tambahMapel(event) {
            event.preventDefault();
            const nama = document.getElementById('namaMapel').value.trim();
            const kkm = document.getElementById('kkmMapel').value.trim();

            if (nama && kkm) {
                daftarMapel.push({ id: Date.now(), nama: nama, kkm: kkm });
                document.getElementById('namaMapel').value = '';
                document.getElementById('kkmMapel').value = '';
                renderTabel();
            }
        }

        // 4. Hapus Mapel
        function hapusMapel(index) {
            if (confirm("Yakin ingin menghapus mata pelajaran ini?")) {
                daftarMapel.splice(index, 1);
                renderTabel();
            }
        }

        // Jalankan saat dimuat
        renderTabel();
    </script>
</body>
</html>
